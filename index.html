<!DOCTYPE html>
<html>
	<head>
	<title>1skuffy commissions</title>
<meta name="color-scheme" content="light">
	<style>
html {
    min-height: 100%;
	color-scheme: only light;
}

body {
	color-scheme: only light;
    forced-color-adjust: none;
    margin: 0;
    min-height: 100vh;

    background-image:
        linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3)),
        url("bgmainn.png");

    background-repeat: no-repeat;
    background-position: center top;
    background-size: cover;
}
		.message {
			z-index:1;
			position: fixed;
			top: 30px;
			left: 20px;
			display: flex;
			width: 20%;

		}


		.cloud{
			z-index: 2;
			flex-direction: column;
			position: relative;
			background-color: rgb(255, 255, 255);
			color: rgb(0, 0, 0);
			padding:20px;
			border-radius: 30px;
			justify-content: center;
			align-items: center;
		}

		.cloud::before {
			z-index: -1;
			content: "";
		    position:absolute;
			background-color: rgb(255, 255, 255);
			height:40px;
			width: 30px;
		    top:-15px;
			left:15px;
			border-left: 2px solid rgb(255, 255, 255);
			border-top: 2px solid rgb(255, 255, 255);
			transform: skew(40deg) rotate(40deg);
		}

           .clouditem {
        color: rgb(0, 0, 0);
		font-size: 17px;
		}

		.skuffy {
			font-style: normal;
			font-weight: 600;
			text-decoration: underline;
		}
	
	.normalcat {
		content:url("44793efdb7b1676d.png");
		border-radius: 50%;
		height: 100%;
		width: 40%;
		margin-top: 30px;
		margin-bottom: 20px;
		transition: transform 0.1s;
		border: 1px solid;
		
		}

		.normalcat:active{
			transform: scale(1.2);
			content:url("scream.png");
		}

		.header {
			z-index:0;
			text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center, middle;
    width: clamp(250px, 40vw, 350px);
    box-sizing: border-box;
    margin: 100px auto;
    padding: 30px;
    background-color: rgba(255, 255, 255, 0.9);
    border-radius: 15px;
	position: fixed;
    left: 50%;
    transform: translateX(-50%);
}

hr{
	border-color:black;
}

		p {
			font-style: italic;

		}

		.status{
			font-size: 24px;
			line-height: 35px;
		}
		
		#open{
			margin-left: 7px;
			color: rgb(6, 88, 3);
			 border: 2px solid rgb(11, 138, 11);
			 background-color: rgb(32, 212, 62);
			padding: 5px;
			font-weight:600;
			box-shadow: 0px 0px 5px 3px rgba(255, 255, 255, 0.3);

		}

		button{
			background-color: rgb(0, 0, 0);
			color:white;
			border: none;
			padding: 10px;
			border-radius: 20px;
			cursor: pointer;
			transition:opacity 0.4s, padding 0.2s;
			box-shadow: 5px 5px 5px rgba(0, 0, 0, 0.2);
			margin-top: 40px;
			margin-bottom: 30px;
			scale: 1.3;
		}

		button:hover{
			opacity:0.6;
			padding-left: 15px;
			padding-right: 15px;
		}

		button:active{
			opacity:0.3;
		}
		.tos {
			margin-left: 20%;
		}
	

		.contact {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 20px;
    position: absolute;
    right: -80px;
    top: 50%;
    transform: translateY(-50%);	
		}

		.web{
	object-fit: contain;
    width: 45px;
    height: 45px;
    border-radius: 40%;
	cursor: pointer;
	transition: all 0.1s;
	box-shadow: 0px 0px 1px 5px rgba(255, 255, 255, 0.7);

		}

		.web:hover{
			transform: scale(1.2);

		}

		@media (max-width: 600px) {

    body {
        background-size: auto 100vh;
        background-position: center top;
    }

    .header {
        position: relative;
        left: auto;
        transform: none;

        width: 90%;
        max-width: 350px;
        margin: 100px auto 30px;
        padding: 20px 10px;
    }

    .message {
        position: relative;
        top: auto;
        left: auto;
        width: 85%;
        margin: 20px auto;
    }

    .cloud {
        padding: 15px;
    }

    .normalcat {
        width: 40%;
    }

    .status {
        font-size: 19px;
        line-height: 30px;
    }

    .contact {
        position: static;
        transform: none;
        flex-direction: row;
        justify-content: center;
        margin-top: 25px;
    }

    .web {
        width: 35px;
        height: 35px;
    }

    .tos {
        margin-left: 5px;
    }
}

		</style>
		
	</head>




<body>

			</div>
	</div>
	</div>
	
	<div class="header">
		<div><img class="normalcat"></div>
		<div><hr></div>

<div><h1 style="margin-bottom:-10px; border: 2px solid white;">1skuffy's Commissions</h1></div>

</div>

</html>
